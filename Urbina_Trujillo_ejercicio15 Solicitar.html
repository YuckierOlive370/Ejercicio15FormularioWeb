<body>
    <h1>Bitacora de prestamo de Equipos</h1>
    <form action="procesar" method="postear">
        <label for="Nombre">Nombre:</label>
        <input type="text" name="Nombre">
        <br>
        <label type="text">Carrera:</label>
        <select id="carrera" name="carrera">
            <option value="IngCivil">Ing. Civil</option>
            <option value="IngSoftwart">Ing. Softwart</option>
            <option value="IngGeodesia">Ing. Geodesia</option> 
            <option value="LicDerecho">Lic. Derecho</option>
            <option value="LicArtes">Lic. Artes</option>
        </select>
        <br>
        <label type="text">Alumno/Profesor:</label>
        <input type="radio" name="A">
        <label name="Alumno">Alumno</label>
        <input type="radio" name="P">
        <label name="Profesor">Profesor</label>
        <br>
        <label for="Prestamo">Prestamo:</label>
        <input type="text" name="Prestamo">
        <br>
        <p>Hora de Prestamo</p>
        <br>
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha">
        <label for="Firma">Firma:</label>
        <input type="text" name="Prestamo">
        <p>Hora de entrega</p>
        <br>
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha">
        <label for="Firma">Firma:</label>
        <input type="text" name="Prestamo">
